
<svg xmlns="http://www.w3.org/2000/svg"
     width="1280"
     height="260"
     viewBox="0 0 1280 260"
     role="img"
     aria-label="Jacob Mallan, RiotPhoenix — Cybersecurity, Infrastructure, Software Engineering">

  <defs>
    <pattern id="grid"
             width="32"
             height="32"
             patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32"
            fill="none"
            stroke="#242A2E"
            stroke-width=".55"/>
    </pattern>

    <linearGradient id="shade" x1="0" x2="1">
      <stop stop-color="#0B0D10" stop-opacity=".1"/>
      <stop offset="1" stop-color="#0B0D10" stop-opacity=".9"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="260" fill="#0B0D10"/>
  <rect width="1280" height="260"
        fill="url(#grid)" opacity=".52"/>
  <rect width="1280" height="260"
        fill="url(#shade)"/>

  <!-- Technical corner details -->
  <path d="M26 46V25H190
           M1090 25H1254V65
           M26 194V235H190
           M1090 235H1254V194"
        fill="none"
        stroke="#465059"
        stroke-width="1.5"/>

  <path d="M26 25H104 M1175 235H1254"
        stroke="#A64B20"
        stroke-width="4"/>

  <!-- Vertical accent -->
  <path d="M65 68V190"
        stroke="#A64B20"
        stroke-width="4"/>

  <!-- Professional identity -->
  <text x="96" y="119"
        font-family="Arial,Helvetica,sans-serif"
        font-size="53"
        font-weight="700"
        letter-spacing="7"
        fill="#F0F2F3">
    JACOB MALLAN
  </text>

  <!-- Developer identity -->
  <text x="100" y="160"
        font-family="Arial,Helvetica,sans-serif"
        font-size="27"
        font-weight="600"
        letter-spacing="6"
        fill="#B45B34">
    RIOTPHOENIX
  </text>

  <!-- Specialisations -->
  <text x="98" y="201"
        font-family="Arial,Helvetica,sans-serif"
        font-size="16"
        letter-spacing="3.2"
        fill="#B1BAC0">
    CYBERSECURITY / INFRASTRUCTURE / SOFTWARE ENGINEERING
  </text>

  <!-- Right-side technical labels -->
  <path d="M1018 76H1207
           M1018 111H1207
           M1018 146H1207
           M1018 181H1207"
        stroke="#394147"
        stroke-width="1"/>

  <g font-family="Arial,Helvetica,sans-serif"
     font-size="14"
     letter-spacing="3"
     fill="#B1BAC0">
    <text x="1031" y="68">BUILD</text>
    <text x="1031" y="103">SECURE</text>
    <text x="1031" y="138">AUTOMATE</text>
    <text x="1031" y="173">EXPLORE</text>
  </g>

  <path d="M1000 48V185"
        stroke="#A64B20"
        stroke-width="2"/>

